name: Build WordPress plugin
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx vite build --config wordpress-export/vite.wp.config.ts
      - run: |
          mkdir -p dist
          cp -r wordpress-export/taiba-ai-automation dist/
          ls -la dist/taiba-ai-automation/assets
      - uses: actions/upload-artifact@v4
        with:
          name: taiba-ai-automation-plugin
          path: dist
